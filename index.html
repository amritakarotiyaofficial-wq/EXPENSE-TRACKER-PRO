<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker Pro</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

    <h1>💰 Expense Tracker Pro</h1>

    <form id="expense-form">

        <input
            type="text"
            id="description"
            placeholder="Expense Description"
            required
        >

        <input
            type="number"
            id="amount"
            placeholder="Amount"
            required
        >

        <select id="category">

            <option value="Food">🍔 Food</option>

            <option value="Travel">🚌 Travel</option>

            <option value="Shopping">🛍 Shopping</option>

            <option value="Bills">💡 Bills</option>

            <option value="Health">🏥 Health</option>

            <option value="Entertainment">🎮 Entertainment</option>

            <option value="Education">📚 Education</option>

            <option value="Other">📦 Other</option>

        </select>

        <input
            type="date"
            id="date"
            required
        >

        <button type="submit">
            ➕ Add Expense
        </button>

    </form>

    <hr>

    <h2>📋 Expense List</h2>

    <ul id="expense-list"></ul>

    <hr>

    <h2>📊 Summary</h2>

    <p><strong>Total Spent:</strong> ₹<span id="total">0</span></p>

    <p><strong>Highest Category:</strong>
        <span id="highest-category">None</span>
    </p>

    <p><strong>This Month:</strong> ₹<span id="month-total">0</span></p>

    <hr>

    <h2>📈 Category Chart</h2>

    <canvas id="expenseChart"></canvas>

</div>

<div id="toast">
    ✅ Expense Added Successfully!
</div>

<script src="script.js"></script>

</body>
</html>
